<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metadata Schema Property Reference</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #20242a;
      --muted: #636b75;
      --line: #d9dee5;
      --accent: #1f6f78;
      --accent-soft: #e5f3f4;
      --match: #e6f6ea;
      --warn: #8a5a00;
      --code: #eef1f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
    }
    header {
      padding: 28px 32px 20px;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.6rem, 2.5vw, 2.2rem);
      letter-spacing: 0;
    }
    p { margin: 0; color: var(--muted); }
    main { padding: 22px 32px 36px; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }
    .tabs {
      display: inline-flex;
      background: #e9edf2;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 4px;
    }
    .tab {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 6px;
      font: inherit;
      cursor: pointer;
    }
    .tab[aria-selected="true"] {
      background: var(--panel);
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(20, 28, 36, 0.12);
    }
    .search {
      min-width: min(420px, 100%);
      flex: 1 1 280px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
      background: var(--panel);
      color: var(--ink);
    }
    .source {
      margin: 0 0 18px;
      font-size: 0.95rem;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }
    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .metric strong { display: block; font-size: 1.35rem; }
    .metric span { color: var(--muted); font-size: 0.9rem; }
    .schema {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      margin: 0 0 16px;
      overflow: hidden;
    }
    .schema-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 5px;
    }
    .schema > summary.schema-header {
      cursor: pointer;
      list-style: none;
      padding-left: 48px;
      position: relative;
    }
    .schema > summary.schema-header::-webkit-details-marker { display: none; }
    .schema > summary.schema-header::before {
      content: "+";
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      position: absolute;
      left: 18px;
      top: 16px;
      border-radius: 5px;
      background: var(--code);
      color: var(--muted);
      font-weight: 700;
    }
    .schema[open] > summary.schema-header::before { content: "-"; }
    .schema-header h2 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: 0;
    }
    .file {
      font-size: 0.84rem;
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      text-align: left;
    }
    th {
      color: #3d4650;
      font-size: 0.78rem;
      text-transform: uppercase;
      background: #f9fafb;
    }
    td { font-size: 0.92rem; }
    tr:last-child td { border-bottom: 0; }
    code {
      background: var(--code);
      border-radius: 5px;
      padding: 2px 5px;
      overflow-wrap: anywhere;
    }
    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 650;
      white-space: nowrap;
    }
    .badge.optional { color: var(--muted); background: #edf0f3; }
    .compare-schema {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      margin: 0 0 16px;
      overflow: hidden;
    }
    .compare-schema summary {
      cursor: pointer;
      list-style: none;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }
    .compare-schema summary::-webkit-details-marker { display: none; }
    .compare-schema summary h2 {
      display: inline;
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: 0;
    }
    .compare-schema summary::before {
      content: "+";
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      margin-right: 8px;
      border-radius: 5px;
      background: var(--code);
      color: var(--muted);
      font-weight: 700;
    }
    .compare-schema[open] summary::before { content: "-"; }
    .compare-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }
    .compare-heading {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 10px 12px;
      background: #f9fafb;
      border-bottom: 1px solid var(--line);
      color: #3d4650;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .compare-heading:first-child,
    .compare-cell:nth-child(odd) {
      border-right: 1px solid var(--line);
    }
    .compare-row { display: contents; }
    .compare-cell {
      min-height: 104px;
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
    }
    .compare-cell.match {
      background: var(--match);
    }
    .compare-row:last-child .compare-cell { border-bottom: 0; }
    .compare-cell.missing {
      background: #111418;
      color: transparent;
    }
    .field-name {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 5px;
    }
    .field-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 6px 0;
    }
    .type-difference {
      background: #fff4d8;
      color: #704800;
    }
    .field-description {
      color: var(--muted);
      font-size: 0.88rem;
    }
    .field-extra {
      margin-top: 6px;
      display: grid;
      gap: 4px;
      color: #3d4650;
      font-size: 0.84rem;
    }
    .field-extra .extra-label {
      color: var(--ink);
      font-weight: 500;
    }
    .field-extra .allowed-value {
      color: var(--ink);
      font-weight: 700;
    }
    .field-extra a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid color-mix(in srgb, var(--accent), transparent 55%);
    }
    .field-extra a:hover { border-bottom-color: var(--accent); }
    .field-target {
      scroll-margin-top: 18px;
    }
    .field-target:target {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
      background: var(--accent-soft);
    }
    .clear-highlight {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      border-radius: 6px;
      padding: 4px 8px;
      margin-left: 8px;
      font: inherit;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .clear-highlight:hover {
      color: var(--ink);
      border-color: var(--accent);
    }
    .empty {
      padding: 18px;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .hidden { display: none; }
    @media (max-width: 820px) {
      header, main { padding-left: 16px; padding-right: 16px; }
      table, thead, tbody, tr, th, td { display: block; }
      thead { display: none; }
      tr { border-bottom: 1px solid var(--line); }
      tr:last-child { border-bottom: 0; }
      td {
        border-bottom: 0;
        padding: 7px 12px;
      }
      td::before {
        content: attr(data-label);
        display: block;
        color: var(--muted);
        font-size: 0.74rem;
        text-transform: uppercase;
        margin-bottom: 2px;
      }
      .compare-grid { grid-template-columns: 1fr; }
      .compare-heading:nth-child(2) { display: none; }
      .compare-heading:first-child::after { content: " / Dataverse"; }
      .compare-row { display: grid; grid-template-columns: 1fr; }
      .compare-cell:nth-child(odd) { border-right: 0; }
      .compare-cell.missing { min-height: 48px; }
    }
  </style>
</head>

99).","path":"journalVolumeIssue.journalPubDate","typeClass":"primitive","controlledVocabulary":"No"},{"name":"journalArticleType","label":"Type of Article","type":"TEXT","required":"No","multiple":"No","description":"Indicates what kind of article this is, for example, a research article, a commentary, a book or product review, a case report, a calendar, etc (based on JATS). ","path":"journalArticleType","typeClass":"controlledVocabulary","controlledVocabulary":"Yes"}]},{"id":"socialscience","title":"Social Science and Humanities Metadata","description":"","file":"C:\\Users\\kados\\.rockit\\metadata-schemas\\dataverse\\socialscience.json","fields":[{"name":"unitOfAnalysis","label":"Unit of Analysis","type":"TEXTBOX","required":"No","multiple":"Yes","description":"Basic unit of analysis or observation that this Dataset describes, such as individuals, families/households, groups, institutions/organizations, administrative units, and more. For information about the DDI's controlled vocabulary for this element, please refer to the DDI web page at http://www.ddialliance.org/controlled-vocabularies.","path":"unitOfAnalysis","typeClass":"primitive","controlledVocabulary":"No"},{"name":"universe","label":"Universe","type":"TEXTBOX","required":"No","multiple":"Yes","description":"Description of the population covered by the data in the file; the group of people or other elements that are the object of the study and to which the study results refer. Age, nationality, and residence commonly help to  delineate a given universe, but any number of other factors may be used, such as age limits, sex, marital status, race, ethnic group, nationality, income, veteran status, criminal convictions, and more. The universe may consist of elements other than persons, such as housing units, court cases, deaths, countries, and so on. In general, it should be possible to tell from the description of the universe whether a given individual or element is a member of the population under study. Also known as the universe of interest, population of interest, and target population.","path":"universe","typeClass":"primitive","controlledVocabulary":"No"},{"name":"timeMethod","label":"Time Method","type":"TEXT","required":"No","multiple":"No","description":"The time method or time dimension of the data collection, such as panel, cross-sectional, trend, time- series, or other.","path":"timeMethod","typeClass":"primitive","controlledVocabulary":"No"},{"name":"dataCollector","label":"Data Collector","type":"TEXT","required":"No","multiple":"No","description":"Individual, agency or organization responsible for  administering the questionnaire or interview or compiling the data.","path":"dataCollector","typeClass":"primitive","controlledVocabulary":"No"},{"name":"collectorTraining","label":"Collector Training","type":"TEXT","required":"No","multiple":"No","description":"Type of training provided to the data collector","path":"collectorTraining","typeClass":"primitive","controlledVocabulary":"No"},{"name":"frequencyOfDataCollection","label":"Frequency","type":"TEXT","required":"No","multiple":"No","description":"If the data collected includes more than one point in time, indicate the frequency with which the data was collected; that is, monthly, quarterly, or other.","path":"frequencyOfDataCollection","typeClass":"primitive","controlledVocabulary":"No"},{"name":"samplingProcedure","label":"Sampling Procedure","type":"TEXTBOX","required":"No","multiple":"No","description":"Type of sample and sample design used to select the survey respondents to represent the population. May include reference to the target sample size and the sampling fraction.","path":"samplingProcedure","typeClass":"primitive","controlledVocabulary":"No"},{"name":"targetSampleSize","label":"Target Sample Size","type":"NONE","required":"No","multiple":"No","description":"Specific information regarding the target sample size, actual  sample size, and the formula used to determine this.","path":"targetSampleSize","typeClass":"compound","controlledVocabulary":"No"},{"name":"targetSampleActualSize","label":"Target Sample Size Actual","type":"INT","required":"No","multiple":"No","description":"Actual sample size.","path":"targetSampleSize.targetSampleActualSize","typeClass":"primitive","controlledVocabulary":"No"},{"name":"targetSampleSizeFormula","label":"Target Sample Size Formula","type":"TEXT","required":"No","multiple":"No","description":"Formula used to determine target sample size.","path":"targetSampleSize.targetSampleSizeFormula","typeClass":"primitive","controlledVocabulary":"No"},{"name":"deviationsFromSampleDesign","label":"Major Deviations for Sample Design","type":"TEXT","required":"No","multiple":"No","description":"Show correspondence as well as discrepancies between the sampled units (obtained) and available statistics for the population (age, sex-ratio, marital status, etc.) as a whole.","path":"deviationsFromSampleDesign","typeClass":"primitive","controlledVocabulary":"No"},{"name":"collectionMode","label":"Collection Mode","type":"TEXTBOX","required":"No","multiple":"Yes","description":"Method used to collect the data; instrumentation characteristics (e.g., telephone interview, mail questionnaire, or other).","path":"collectionMode","typeClass":"primitive","controlledVocabulary":"No"},{"name":"researchInstrument","label":"Type of Research Instrument","type":"TEXT","required":"No","multiple":"No","description":"Type of data collection instrument used. Structured indicates an instrument in which all respondents are asked the same questions/tests, possibly with precoded answers. If a small portion of such a questionnaire includes open-ended questions, provide appropriate comments. Semi-structured indicates that the research instrument contains mainly open-ended questions. Unstructured indicates that in-depth interviews were conducted.","path":"researchInstrument","typeClass":"primitive","controlledVocabulary":"No"},{"name":"dataCollectionSituation","label":"Characteristics of Data Collection Situation","type":"TEXTBOX","required":"No","multiple":"No","description":"Description of noteworthy aspects of the data collection situation. Includes information on factors such as cooperativeness of respondents, duration of interviews, number of call backs, or similar.","path":"dataCollectionSituation","typeClass":"primitive","controlledVocabulary":"No"},{"name":"actionsToMinimizeLoss","label":"Actions to Minimize Losses","type":"TEXT","required":"No","multiple":"No","description":"Summary of actions taken to minimize data loss. Include information on actions such as follow-up visits, supervisory checks, historical matching, estimation, and so on.","path":"actionsToMinimizeLoss","typeClass":"primitive","controlledVocabulary":"No"},{"name":"controlOperations","label":"Control Operations","type":"TEXT","required":"No","multiple":"No","description":"Control OperationsMethods to facilitate data control performed by the primary investigator or by the data archive.","path":"controlOperations","typeClass":"primitive","controlledVocabulary":"No"},{"name":"weighting","label":"Weighting","type":"TEXTBOX","required":"No","multiple":"No","description":"The use of sampling procedures might make it necessary to apply weights to produce accurate statistical results. Describes the criteria for using weights in analysis of a collection. If a weighting formula or coefficient was developed, the formula is provided, its elements are defined, and it is indicated how the formula was applied to the data.","path":"weighting","typeClass":"primitive","controlledVocabulary":"No"},{"name":"cleaningOperations","label":"Cleaning Operations","type":"TEXT","required":"No","multiple":"No","description":"Methods used to clean the data collection, such as consistency checking, wildcode checking, or other.","path":"cleaningOperations","typeClass":"primitive","controlledVocabulary":"No"},{"name":"datasetLevelErrorNotes","label":"Study Level Error Notes","type":"TEXT","required":"No","multiple":"No","description":"Note element used for any information annotating or clarifying the methodology and processing of the study. ","path":"datasetLevelErrorNotes","typeClass":"primitive","controlledVocabulary":"No"},{"name":"responseRate","label":"Response Rate","type":"TEXTBOX","required":"No","multiple":"No","description":"Percentage of sample members who provided information.","path":"responseRate","typeClass":"primitive","controlledVocabulary":"No"},{"name":"samplingErrorEstimates","label":"Estimates of Sampling Error","type":"TEXT","required":"No","multiple":"No","description":"Measure of how precisely one can estimate a population value from a given sample.","path":"samplingErrorEstimates","typeClass":"primitive","controlledVocabulary":"No"},{"name":"otherDataAppraisal","label":"Other Forms of Data Appraisal","type":"TEXT","required":"No","multiple":"No","description":"Other issues pertaining to the data appraisal. Describe issues such as response variance, nonresponse rate  and testing for bias, interviewer and response bias, confidence levels, question bias, or similar.","path":"otherDataAppraisal","typeClass":"primitive","controlledVocabulary":"No"},{"name":"socialScienceNotes","label":"Notes","type":"NONE","required":"No","multiple":"No","description":"General notes about this Dataset.","path":"socialScienceNotes","typeClass":"compound","controlledVocabulary":"No"},{"name":"socialScienceNotesType","label":"Notes Type","type":"TEXT","required":"No","multiple":"No","description":"Type of note.","path":"socialScienceNotes.socialScienceNotesType","typeClass":"primitive","controlledVocabulary":"No"},{"name":"socialScienceNotesSubject","label":"Notes Subject","type":"TEXT","required":"No","multiple":"No","description":"Note subject.","path":"socialScienceNotes.socialScienceNotesSubject","typeClass":"primitive","controlledVocabulary":"No"},{"name":"socialScienceNotesText","label":"Notes Text","type":"TEXTBOX","required":"No","multiple":"No","description":"Text for this note.","path":"socialScienceNotes.socialScienceNotesText","typeClass":"primitive","controlledVocabulary":"No"}]}]}</script>
  <script>
    const data = JSON.parse(document.getElementById('schema-data').textContent);
    const tabs = Array.from(document.querySelectorAll('.tab'));
    const search = document.querySelector('.search');
    const source = document.querySelector('.source');
    const summary = document.querySelector('.summary');
    const content = document.querySelector('.content');
    let activeTab = 'arp';
    let activeHash = window.location.hash;

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[char]));
    }

    function fieldMatches(field, query) {
      if (!query) {
        return true;
      }
      return [field.name, field.label, field.type, field.required, field.multiple, field.description, field.path, field.identifier, field.allowedValues, field.condition]
        .join(' ')
        .toLowerCase()
        .includes(query);
    }

    function renderMetric(value, label) {
      return '<div class="metric"><strong>' + escapeHtml(value) + '</strong><span>' + escapeHtml(label) + '</span></div>';
    }

    function renderBadge(value) {
      const text = value || 'No';
      const optional = text === 'No' || text === '';
      return '<span class="badge ' + (optional ? 'optional' : '') + '">' + escapeHtml(text) + '</span>';
    }

    function fieldAnchorId(sourceKey, field) {
      return sourceKey + '-' + String(field.name || field.path || field.label || '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-|-$/g, '');
    }

    function linkedText(value, sourceKey) {
      const text = escapeHtml(value || '');
      if (!sourceKey) {
        return text;
      }

      return text.replace(/\b([A-Za-z][A-Za-z0-9_]*[A-Za-z0-9])\b/g, (match, fieldName) => {
        const schemas = data[sourceKey] || [];
        const field = schemas.flatMap(schema => schema.fields).find(candidate => candidate.name === fieldName);
        if (!field) {
          return match;
        }
        return '<a href="#' + escapeHtml(fieldAnchorId(sourceKey, field)) + '">' + match + '</a>';
      });
    }

    function renderAllowedValues(value, sourceKey) {
      const text = linkedText(value, sourceKey);
      return text.split(/(,\s*)/).map(part => {
        if (/^,\s*$/.test(part) || !part.trim()) {
          return part;
        }
        if (part.includes('<a ')) {
          return part.replace(/(<a [^>]*>)(.*?)(<\/a>)/g, '$1<span class="allowed-value">$2</span>$3');
        }
        return '<span class="allowed-value">' + part + '</span>';
      }).join('');
    }

    function renderFieldDescription(field, sourceKey) {
      const clearButton = activeHash && activeHash === '#' + fieldAnchorId(sourceKey, field)
        ? '<button class="clear-highlight" type="button" data-clear-highlight>Clear highlight</button>'
        : '';
      const extras = [
        field.allowedValues ? '<div><span class="extra-label">Allowed values:</span> ' + renderAllowedValues(field.allowedValues, sourceKey) + '</div>' : '',
        field.condition ? '<div><span class="extra-label">Condition:</span> ' + linkedText(field.condition, sourceKey) + clearButton + '</div>' : clearButton
      ].filter(Boolean).join('');

      return escapeHtml(field.description || 'No description provided.')
        + (extras ? '<div class="field-extra">' + extras + '</div>' : '');
    }

    function schemaDomain(schema) {
      const text = (schema.id + ' ' + schema.title).toLowerCase();
      if (text.includes('citation')) return 'citation';
      if (text.includes('journal')) return 'journal';
      if (text.includes('geospatial')) return 'geospatial';
      if (text.includes('social')) return 'social science and humanities';
      if (text.includes('astro')) return 'astronomy and astrophysics';
      if (text.includes('life') || text.includes('biomedical')) return 'life sciences / biomedical';
      if (text.includes('3d')) return '3d objects';
      return schema.title.toLowerCase();
    }

    function fieldKeys(field) {
      const keys = new Set();
      const values = [field.name, field.path, field.identifier].filter(Boolean);
      values.forEach(value => {
        const lastPart = String(value).split(/[/.#:]/).filter(Boolean).pop();
        if (lastPart) {
          keys.add(lastPart.toLowerCase());
        }
      });
      if (field.label) {
        keys.add(String(field.label).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim());
      }
      return keys;
    }

    function fieldPrimaryKey(field) {
      return Array.from(fieldKeys(field))[0] || String(field.name || field.label || '').toLowerCase();
    }

    function findMatchingField(field, candidates, used) {
      const keys = fieldKeys(field);
      return candidates.find(candidate => !used.has(candidate)
        && Array.from(fieldKeys(candidate)).some(key => keys.has(key)));
    }

    function normalizeComparableText(value) {
      return String(value || '')
        .toLowerCase()
        .replace(/dataset|resource|data set/g, 'dataset')
        .replace(/[^a-z0-9]+/g, ' ')
        .trim();
    }

    function normalizeExpectedValue(field) {
      const rawValue = normalizeComparableText(field.type || field.typeClass || '');
      const equivalentTypes = new Map([
        ['textarea', 'multiline text'],
        ['textbox', 'multiline text'],
        ['text area', 'multiline text'],
        ['text box', 'multiline text'],
        ['text', 'text'],
        ['string', 'text'],
        ['url', 'url'],
        ['date', 'date'],
        ['number', 'number'],
        ['int', 'number'],
        ['integer', 'number'],
        ['float', 'number'],
        ['bool', 'boolean'],
        ['boolean', 'boolean']
      ]);
      return equivalentTypes.get(rawValue) || rawValue;
    }

    function rawExpectedValue(field) {
      return normalizeComparableText(field.type || field.typeClass || '');
    }

    function fieldsAreBasicallySame(left, right) {
      if (!left || !right) {
        return false;
      }
      const leftNames = fieldKeys(left);
      const rightNames = fieldKeys(right);
      const nameMatches = Array.from(leftNames).some(key => rightNames.has(key));
      const descriptionMatches = normalizeComparableText(left.description) === normalizeComparableText(right.description);
      const expectedValueMatches = normalizeExpectedValue(left) === normalizeExpectedValue(right);
      return nameMatches && descriptionMatches && expectedValueMatches;
    }

    function fieldsHaveRawExpectedValueDifference(left, right) {
      return fieldsAreBasicallySame(left, right) && rawExpectedValue(left) !== rawExpectedValue(right);
    }

    function compareSchemas() {
      const dataverseByDomain = new Map(data.dataverse.map(schema => [schemaDomain(schema), schema]));
      const arpByDomain = new Map(data.arp.map(schema => [schemaDomain(schema), schema]));
      const domains = Array.from(new Set([
        ...data.arp.map(schemaDomain),
        ...data.dataverse.map(schemaDomain)
      ])).sort((left, right) => left.localeCompare(right));

      return domains.map(domain => {
        const arp = arpByDomain.get(domain);
        const dataverse = dataverseByDomain.get(domain);
        const usedDataverseFields = new Set();
        const rows = [];

        (arp?.fields || []).forEach(arpField => {
          const dataverseField = dataverse ? findMatchingField(arpField, dataverse.fields, usedDataverseFields) : undefined;
          if (dataverseField) {
            usedDataverseFields.add(dataverseField);
          }
          rows.push({ key: fieldPrimaryKey(arpField), arpField, dataverseField });
        });

        (dataverse?.fields || []).forEach(dataverseField => {
          if (!usedDataverseFields.has(dataverseField)) {
            rows.push({ key: fieldPrimaryKey(dataverseField), arpField: undefined, dataverseField });
          }
        });

        return { domain, arp, dataverse, rows };
      });
    }

    function compareRowMatches(row, query) {
      return !query || [row.arpField, row.dataverseField].some(field => field && fieldMatches(field, query));
    }

    function renderFieldCard(field, isMatch, hasTypeDifference, sourceKey) {
      if (!field) {
        return '<div class="compare-cell missing" aria-label="No matching property"></div>';
      }

      return '<div id="' + escapeHtml(fieldAnchorId(sourceKey, field)) + '" class="compare-cell field-target' + (isMatch ? ' match' : '') + '">'
        + '<div class="field-name"><code>' + escapeHtml(field.name) + '</code>' + (field.label ? '<strong>' + escapeHtml(field.label) + '</strong>' : '') + '</div>'
        + '<div class="file">' + escapeHtml(field.path || field.identifier || '') + '</div>'
        + '<div class="field-meta">'
        + '<span class="badge optional">' + escapeHtml(field.type || field.typeClass || 'Unknown type') + '</span>'
        + (hasTypeDifference ? '<span class="badge type-difference">format label differs</span>' : '')
        + '</div>'
        + '<div class="field-description">' + renderFieldDescription(field, sourceKey) + '</div>'
        + '</div>';
    }

    function renderComparison(query) {
      const comparisons = compareSchemas()
        .map(comparison => ({ ...comparison, rows: comparison.rows.filter(row => compareRowMatches(row, query)) }))
        .filter(comparison => comparison.rows.length > 0);
      const totalRows = compareSchemas().reduce((count, comparison) => count + comparison.rows.length, 0);
      const visibleRows = comparisons.reduce((count, comparison) => count + comparison.rows.length, 0);
      const matchedRows = compareSchemas().reduce((count, comparison) => count + comparison.rows.filter(row => row.arpField && row.dataverseField).length, 0);

      source.innerHTML = 'Sources: <code>' + escapeHtml(data.sources.arp) + '</code> and <code>' + escapeHtml(data.sources.dataverse) + '</code>';
      summary.innerHTML = [
        renderMetric(comparisons.length, 'schema comparisons'),
        renderMetric(totalRows, 'aligned property rows'),
        renderMetric(matchedRows, 'matched properties'),
        renderMetric(visibleRows, query ? 'matching rows' : 'visible rows')
      ].join('');

      if (!comparisons.length) {
        content.innerHTML = '<div class="empty">No comparison rows match the current search.</div>';
        return;
      }

      content.innerHTML = comparisons.map((comparison, index) => {
        const rows = comparison.rows.map(row => {
          const isMatch = fieldsAreBasicallySame(row.arpField, row.dataverseField);
          const hasTypeDifference = fieldsHaveRawExpectedValueDifference(row.arpField, row.dataverseField);
          return '<div class="compare-row">'
            + renderFieldCard(row.arpField, isMatch, hasTypeDifference, 'arp')
            + renderFieldCard(row.dataverseField, isMatch, hasTypeDifference, 'dataverse')
            + '</div>';
        }).join('');
        const title = comparison.domain.replace(/\b\w/g, letter => letter.toUpperCase());
        const arpTitle = comparison.arp ? comparison.arp.title : 'No ARP schema';
        const dataverseTitle = comparison.dataverse ? comparison.dataverse.title : 'No Dataverse schema';

        return '<details class="compare-schema" ' + (index === 0 ? 'open' : '') + '>'
          + '<summary><h2>' + escapeHtml(title) + '</h2> <span class="badge optional">' + comparison.rows.length + ' aligned rows</span>'
          + '<div class="file">ARP: ' + escapeHtml(arpTitle) + ' | Dataverse: ' + escapeHtml(dataverseTitle) + '</div></summary>'
          + '<div class="compare-grid">'
          + '<div class="compare-heading">ARP properties</div>'
          + '<div class="compare-heading">Dataverse properties</div>'
          + rows
          + '</div>'
          + '</details>';
      }).join('');
    }

    function renderSchemaTables(query) {
      const schemas = data[activeTab];
      const filteredSchemas = schemas
        .map(schema => ({ ...schema, fields: schema.fields.filter(field => fieldMatches(field, query)) }))
        .filter(schema => schema.fields.length > 0);
      const fieldCount = schemas.reduce((count, schema) => count + schema.fields.length, 0);
      const visibleFieldCount = filteredSchemas.reduce((count, schema) => count + schema.fields.length, 0);

      source.innerHTML = 'Source: <code>' + escapeHtml(data.sources[activeTab]) + '</code>';
      summary.innerHTML = [
        renderMetric(schemas.length, 'schema groups'),
        renderMetric(fieldCount, 'total properties'),
        renderMetric(visibleFieldCount, query ? 'matching properties' : 'visible properties')
      ].join('');

      if (!filteredSchemas.length) {
        content.innerHTML = '<div class="empty">No properties match the current search.</div>';
        return;
      }

      content.innerHTML = filteredSchemas.map((schema, index) => {
        const rows = schema.fields.map(field => '<tr id="' + escapeHtml(fieldAnchorId(activeTab, field)) + '" class="field-target">'
          + '<td data-label="Property"><code>' + escapeHtml(field.name) + '</code><div class="file">' + escapeHtml(field.path || '') + '</div></td>'
          + '<td data-label="Label">' + escapeHtml(field.label || '') + '</td>'
          + '<td data-label="Type">' + escapeHtml(field.type || field.typeClass || '') + '</td>'
          + '<td data-label="Required">' + renderBadge(field.required) + '</td>'
          + '<td data-label="Multiple">' + renderBadge(field.multiple) + '</td>'
          + '<td data-label="Description">' + renderFieldDescription(field, activeTab) + '</td>'
          + '</tr>').join('');

        return '<details class="schema" ' + (index === 0 ? 'open' : '') + '>'
          + '<summary class="schema-header">'
          + '<h2>' + escapeHtml(schema.title) + ' <span class="badge optional">' + schema.fields.length + ' properties</span></h2>'
          + (schema.description ? '<p>' + escapeHtml(schema.description) + '</p>' : '')
          + '<div class="file">' + escapeHtml(schema.file) + '</div>'
          + '</summary>'
          + '<table>'
          + '<thead><tr><th style="width: 19%">Property</th><th style="width: 16%">Label</th><th style="width: 12%">Type</th><th style="width: 9%">Required</th><th style="width: 9%">Multiple</th><th>Description</th></tr></thead>'
          + '<tbody>' + rows + '</tbody>'
          + '</table>'
          + '</details>';
      }).join('');
    }

    function render() {
      const query = search.value.trim().toLowerCase();
      if (activeTab === 'arp-vs-dv') {
        renderComparison(query);
      } else {
        renderSchemaTables(query);
      }
    }

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        activeTab = tab.dataset.tab;
        tabs.forEach(item => item.setAttribute('aria-selected', String(item === tab)));
        render();
      });
    });

    search.addEventListener('input', render);
    window.addEventListener('hashchange', () => {
      activeHash = window.location.hash;
      render();
    });
    content.addEventListener('click', event => {
      if (!event.target.closest('[data-clear-highlight]')) {
        return;
      }
      event.preventDefault();
      history.pushState('', document.title, window.location.pathname + window.location.search);
      activeHash = '';
      render();
    });
    render();
  </script>
